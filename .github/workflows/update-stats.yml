name: Update download stats

on:
  schedule:
    - cron: '0 9 * * 1'   # Every Monday at 09:00 UTC
  workflow_dispatch:        # Allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch stats and update AUDITS.md
        run: python scripts/update-stats.py

      - name: Commit if changed
        run: |
          git config user.name "kenaz-bot"
          git config user.email "kenaz-bot@users.noreply.github.com"
          git add AUDITS.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(stats): auto-update download stats $(date -u +%Y-%m-%d)"
            git push
          fi
