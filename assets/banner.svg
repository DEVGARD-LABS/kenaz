<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3d8ef0"/>
      <stop offset="100%" style="stop-color:#a259f7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" fill="url(#bg)" rx="12"/>

  <!-- Border -->
  <rect width="900" height="220" fill="none" stroke="#21262d" stroke-width="1.5" rx="12"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="900" height="2" fill="url(#accent)" rx="1"/>

  <!-- Rune glyph -->
  <text x="72" y="130" font-family="serif" font-size="88" fill="#3d8ef0" filter="url(#glow)" text-anchor="middle" opacity="0.95">ᚲ</text>

  <!-- Vertical divider -->
  <line x1="118" y1="48" x2="118" y2="172" stroke="#21262d" stroke-width="1.5"/>

  <!-- Product name -->
  <text x="148" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="700" fill="#f0f6fc" letter-spacing="-1">KENAZ</text>

  <!-- Tagline -->
  <text x="150" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#8b949e" letter-spacing="0.2">Security auditor for Claude Code plugins &amp; MCP servers</text>

  <!-- Badges row -->
  <!-- v1.1.0 -->
  <rect x="150" y="165" width="68" height="22" rx="4" fill="#1f3a5f"/>
  <text x="184" y="180" font-family="monospace" font-size="11" fill="#79c0ff" text-anchor="middle">v1.1.0</text>

  <!-- MIT -->
  <rect x="226" y="165" width="46" height="22" rx="4" fill="#1a3a1a"/>
  <text x="249" y="180" font-family="monospace" font-size="11" fill="#56d364" text-anchor="middle">MIT</text>

  <!-- 99 tests -->
  <rect x="280" y="165" width="84" height="22" rx="4" fill="#1a3a1a"/>
  <text x="322" y="180" font-family="monospace" font-size="11" fill="#56d364" text-anchor="middle">99 tests ✓</text>

  <!-- offline -->
  <rect x="372" y="165" width="80" height="22" rx="4" fill="#1f3a5f"/>
  <text x="412" y="180" font-family="monospace" font-size="11" fill="#79c0ff" text-anchor="middle">100% offline</text>

  <!-- zero deps -->
  <rect x="460" y="165" width="76" height="22" rx="4" fill="#2d1a3a"/>
  <text x="498" y="180" font-family="monospace" font-size="11" fill="#d2a8ff" text-anchor="middle">zero deps</text>

  <!-- Decorative right side: terminal lines -->
  <g opacity="0.18">
    <text x="730" y="75" font-family="monospace" font-size="12" fill="#3d8ef0">/kenaz git-helper</text>
    <text x="730" y="95" font-family="monospace" font-size="11" fill="#56d364">PA-001 exfiltration ........ PASS</text>
    <text x="730" y="112" font-family="monospace" font-size="11" fill="#56d364">PA-015 prompt-inject ....... PASS</text>
    <text x="730" y="129" font-family="monospace" font-size="11" fill="#e3b341">PA-022 shell-inject ........ WARN</text>
    <text x="730" y="146" font-family="monospace" font-size="11" fill="#56d364">PA-004 secret-read ......... PASS</text>
    <line x1="728" y1="157" x2="882" y2="157" stroke="#21262d" stroke-width="1"/>
    <text x="730" y="172" font-family="monospace" font-size="12" fill="#e3b341">verdict: REVIEW  score: 88</text>
  </g>
</svg>
