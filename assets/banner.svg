<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#04080f"/>
      <stop offset="50%" style="stop-color:#060a12"/>
      <stop offset="100%" style="stop-color:#080c14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0"/>
      <stop offset="20%" style="stop-color:#00d4ff"/>
      <stop offset="80%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="divider" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0"/>
      <stop offset="40%" style="stop-color:#00d4ff;stop-opacity:0.55"/>
      <stop offset="60%" style="stop-color:#a855f7;stop-opacity:0.55"/>
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0"/>
    </linearGradient>

    <!-- RUNE: multi-layer glow + turbulence shimmer -->
    <filter id="runeF" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="22" result="b22"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="b9"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.04" numOctaves="2" result="noise">
        <animate attributeName="baseFrequency" values="0.02 0.04;0.04 0.02;0.02 0.04" dur="7s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5" xChannelSelector="R" yChannelSelector="G" result="shimmer"/>
      <feMerge><feMergeNode in="b22"/><feMergeNode in="b9"/><feMergeNode in="shimmer"/></feMerge>
    </filter>

    <pattern id="crt" x="0" y="0" width="1200" height="4" patternUnits="userSpaceOnUse">
      <rect width="1200" height="2" fill="transparent"/>
      <rect y="2" width="1200" height="2" fill="rgba(0,0,0,0.1)"/>
    </pattern>
    <clipPath id="clip"><rect width="1200" height="260" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <!-- Background + CRT -->
    <rect width="1200" height="260" fill="url(#bg)"/>
    <rect width="1200" height="260" fill="url(#crt)"/>

    <!-- Grid -->
    <g opacity="0.028" stroke="#00d4ff" stroke-width="0.5">
      <line x1="0" y1="40" x2="1200" y2="40"/><line x1="0" y1="80" x2="1200" y2="80"/>
      <line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="160" x2="1200" y2="160"/>
      <line x1="0" y1="200" x2="1200" y2="200"/><line x1="0" y1="240" x2="1200" y2="240"/>
      <line x1="80" y1="0" x2="80" y2="260"/><line x1="160" y1="0" x2="160" y2="260"/>
      <line x1="240" y1="0" x2="240" y2="260"/><line x1="320" y1="0" x2="320" y2="260"/>
      <line x1="400" y1="0" x2="400" y2="260"/><line x1="480" y1="0" x2="480" y2="260"/>
      <line x1="560" y1="0" x2="560" y2="260"/><line x1="640" y1="0" x2="640" y2="260"/>
      <line x1="720" y1="0" x2="720" y2="260"/><line x1="800" y1="0" x2="800" y2="260"/>
      <line x1="880" y1="0" x2="880" y2="260"/><line x1="960" y1="0" x2="960" y2="260"/>
      <line x1="1040" y1="0" x2="1040" y2="260"/><line x1="1120" y1="0" x2="1120" y2="260"/>
    </g>

    <!-- Top accent -->
    <rect y="0" width="1200" height="2" fill="url(#accent)"/>

    <!-- Global horizontal scan sweep -->
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#00d4ff" stroke-width="0.8" opacity="0">
      <animate attributeName="y1" values="-2;262;-2" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="-2;262;-2" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.07;0.07;0" dur="14s" repeatCount="indefinite" keyTimes="0;0.04;0.18;1"/>
    </line>

    <!-- Corner HUD brackets -->
    <polyline points="32,10 10,10 10,32" fill="none" stroke="#00d4ff" stroke-width="1.5">
      <animate attributeName="opacity" values="0.25;0.75;0.25" dur="4s" repeatCount="indefinite"/>
    </polyline>
    <polyline points="1168,10 1190,10 1190,32" fill="none" stroke="#a855f7" stroke-width="1.5">
      <animate attributeName="opacity" values="0.25;0.75;0.25" dur="4s" begin="2s" repeatCount="indefinite"/>
    </polyline>
    <polyline points="32,250 10,250 10,228" fill="none" stroke="#00d4ff" stroke-width="1.5">
      <animate attributeName="opacity" values="0.25;0.75;0.25" dur="4s" begin="1s" repeatCount="indefinite"/>
    </polyline>
    <polyline points="1168,250 1190,250 1190,228" fill="none" stroke="#a855f7" stroke-width="1.5">
      <animate attributeName="opacity" values="0.25;0.75;0.25" dur="4s" begin="3s" repeatCount="indefinite"/>
    </polyline>

    <!-- Ambient glow (rune area) -->
    <ellipse cx="112" cy="130" rx="110" ry="75" fill="#00d4ff" opacity="0.04">
      <animate attributeName="opacity" values="0.03;0.07;0.03" dur="4s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Floating particles -->
    <circle cx="55" cy="185" r="1.2" fill="#00d4ff" opacity="0">
      <animate attributeName="cy" values="185;45;185" dur="5.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="5.2s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="55;63;55" dur="5.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="205" r="0.8" fill="#a855f7" opacity="0">
      <animate attributeName="cy" values="205;55;205" dur="4.1s" begin="1.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="4.1s" begin="1.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="82" cy="215" r="1" fill="#00d4ff" opacity="0">
      <animate attributeName="cy" values="215;70;215" dur="6.3s" begin="0.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.55;0" dur="6.3s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="148" cy="195" r="0.7" fill="#56d364" opacity="0">
      <animate attributeName="cy" values="195;80;195" dur="3.9s" begin="2.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.4;0" dur="3.9s" begin="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="97" cy="220" r="0.9" fill="#a855f7" opacity="0">
      <animate attributeName="cy" values="220;65;220" dur="5.8s" begin="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.45;0" dur="5.8s" begin="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="133" cy="210" r="0.6" fill="#00d4ff" opacity="0">
      <animate attributeName="cy" values="210;88;210" dur="4.7s" begin="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.4;0" dur="4.7s" begin="1.8s" repeatCount="indefinite"/>
    </circle>

    <!-- Rune — shimmer glow layer -->
    <text x="112" y="172" font-family="serif" font-size="150" text-anchor="middle" fill="#00d4ff" filter="url(#runeF)">&#x16B2;
      <animate attributeName="opacity" values="0.12;0.28;0.12" dur="3.5s" repeatCount="indefinite"/>
    </text>
    <!-- Rune — main crisp layer -->
    <text x="112" y="172" font-family="serif" font-size="150" text-anchor="middle" fill="#cce8ff" opacity="0.84">&#x16B2;</text>

    <!-- Vertical divider -->
    <rect x="215" y="28" width="1" height="204" fill="url(#divider)"/>

    <!-- CENTER: foreignObject — KENAZ + content -->
    <foreignObject x="234" y="0" width="742" height="260">
      <div xmlns="http://www.w3.org/1999/xhtml" style="width:742px;height:260px;display:flex;flex-direction:column;justify-content:center;padding:0;box-sizing:border-box;overflow:hidden;">

        <div style="font-family:'Cinzel',Trajan,serif;font-size:86px;font-weight:900;letter-spacing:6px;line-height:1;color:#eaf4ff;animation:glitch 8s infinite;text-shadow:0 0 22px rgba(0,212,255,0.55),0 0 75px rgba(0,212,255,0.2);">KENAZ</div>

        <div style="font-family:'SF Mono','Fira Code',Consolas,monospace;font-size:11px;letter-spacing:5px;color:#00d4ff;margin-top:6px;opacity:0.8;">&#x16B2; &#160;&#183;&#160; FUTHARK &#160;&#183;&#160; KNOWLEDGE &#160;&#183;&#160; TORCH</div>

        <div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;color:#8b949e;margin-top:9px;letter-spacing:0.2px;">Security auditor for Claude Code plugins &amp; MCP servers</div>

        <div style="margin-top:16px;">
          <div style="font-family:'SF Mono',Consolas,monospace;font-size:9px;letter-spacing:2.5px;color:rgba(0,212,255,0.4);margin-bottom:5px;">SCANNING THREAT DATABASE &#160;&#183;&#160; 23 RULES</div>
          <div style="width:300px;height:3px;background:rgba(0,212,255,0.07);border-radius:2px;overflow:hidden;border:1px solid rgba(0,212,255,0.12);">
            <div style="height:100%;background:linear-gradient(90deg,#00d4ff,#a855f7);border-radius:2px;animation:bar 5s ease-in-out infinite;width:0%;"></div>
          </div>
        </div>

        <div style="display:flex;gap:5px;margin-top:13px;flex-wrap:nowrap;">
          <span style="padding:2px 8px;background:rgba(0,212,255,0.07);border:1px solid rgba(0,212,255,0.22);border-radius:4px;font-family:'SF Mono',Consolas,monospace;font-size:10.5px;font-weight:600;color:#79c0ff;white-space:nowrap;">v1.1.0</span>
          <span style="padding:2px 8px;background:rgba(86,211,100,0.07);border:1px solid rgba(86,211,100,0.22);border-radius:4px;font-family:'SF Mono',Consolas,monospace;font-size:10.5px;font-weight:600;color:#56d364;white-space:nowrap;">MIT</span>
          <span style="padding:2px 8px;background:rgba(86,211,100,0.07);border:1px solid rgba(86,211,100,0.22);border-radius:4px;font-family:'SF Mono',Consolas,monospace;font-size:10.5px;font-weight:600;color:#56d364;white-space:nowrap;">99 tests &#10003;</span>
          <span style="padding:2px 8px;background:rgba(0,212,255,0.07);border:1px solid rgba(0,212,255,0.22);border-radius:4px;font-family:'SF Mono',Consolas,monospace;font-size:10.5px;font-weight:600;color:#79c0ff;white-space:nowrap;">100% offline</span>
          <span style="padding:2px 8px;background:rgba(168,85,247,0.07);border:1px solid rgba(168,85,247,0.22);border-radius:4px;font-family:'SF Mono',Consolas,monospace;font-size:10.5px;font-weight:600;color:#d2a8ff;white-space:nowrap;">zero deps</span>
          <span style="padding:2px 8px;background:rgba(227,179,65,0.07);border:1px solid rgba(227,179,65,0.22);border-radius:4px;font-family:'SF Mono',Consolas,monospace;font-size:10.5px;font-weight:600;color:#e3b341;white-space:nowrap;">OWASP Top 10</span>
        </div>

        <style>
          @font-face{font-family:'Cinzel';font-style:normal;font-weight:900;src:url('data:font/woff2;base64,') format('woff2');}
          @keyframes glitch{0%,85%,100%{text-shadow:0 0 22px rgba(0,212,255,0.55),0 0 75px rgba(0,212,255,0.2);transform:none}86%{text-shadow:3px 0 #00d4ff,-3px 0 #f05;transform:translateX(-2px)}87%{text-shadow:-4px 0 #00d4ff,4px 0 #f05;transform:translateX(3px)}88%{text-shadow:2px 0 #f05,-2px 0 #00d4ff;transform:translateX(-1px)}89%{text-shadow:0 0 22px rgba(0,212,255,0.55);transform:none}}
          @keyframes bar{0%{width:0%}50%{width:88%}85%{width:88%}95%{width:100%}97%{width:0%}100%{width:0%}}
        </style>
      </div>
    </foreignObject>

    <!-- TERMINAL PANEL — pure SVG (cross-compatible) -->
    <rect x="992" y="26" width="192" height="210" rx="8" fill="#010409" stroke="#1c2333" stroke-width="1"/>
    <rect x="992" y="26" width="192" height="28" rx="8" fill="#0d1117"/>
    <rect x="992" y="40" width="192" height="14" fill="#0d1117"/>
    <circle cx="1010" cy="40" r="5" fill="#ff5f57"/>
    <circle cx="1025" cy="40" r="5" fill="#febc2e"/>
    <circle cx="1040" cy="40" r="5" fill="#28c840"/>
    <text x="1088" y="44.5" font-family="monospace" font-size="9" fill="#3d444d" text-anchor="middle">kenaz &#x2014; scan</text>

    <!-- Terminal lines — SVG animate for universal compat -->
    <g font-family="'SF Mono','Fira Code',monospace" font-size="10">
      <text x="1003" y="80" fill="#3d8ef0" opacity="0">$ /kenaz git-helper
        <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.25s" fill="freeze"/>
      </text>
      <!-- separator drawn as animated line -->
      <line x1="1003" y1="91" x2="1003" y2="91" stroke="#30363d" stroke-width="0.6" opacity="0">
        <animate attributeName="x2" from="1003" to="1178" begin="0.9s" dur="0.4s" fill="freeze"/>
        <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.1s" fill="freeze"/>
      </line>
      <text x="1003" y="104" fill="#484f58" opacity="0">
        <tspan fill="#56d364">&#x2713;</tspan><tspan> PA-001  exfiltration</tspan>
        <animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.2s" fill="freeze"/>
      </text>
      <text x="1003" y="120" fill="#484f58" opacity="0">
        <tspan fill="#56d364">&#x2713;</tspan><tspan> PA-004  secret-read</tspan>
        <animate attributeName="opacity" from="0" to="1" begin="1.9s" dur="0.2s" fill="freeze"/>
      </text>
      <text x="1003" y="136" fill="#484f58" opacity="0">
        <tspan fill="#e3b341">&#x26A0;</tspan><tspan> PA-022  shell-inject</tspan>
        <animate attributeName="opacity" from="0" to="1" begin="2.4s" dur="0.2s" fill="freeze"/>
      </text>
      <text x="1003" y="152" fill="#484f58" opacity="0">
        <tspan fill="#56d364">&#x2713;</tspan><tspan> PA-015  prompt-inject</tspan>
        <animate attributeName="opacity" from="0" to="1" begin="2.9s" dur="0.2s" fill="freeze"/>
      </text>
      <!-- separator 2 -->
      <line x1="1003" y1="163" x2="1003" y2="163" stroke="#30363d" stroke-width="0.6" opacity="0">
        <animate attributeName="x2" from="1003" to="1178" begin="3.4s" dur="0.4s" fill="freeze"/>
        <animate attributeName="opacity" from="0" to="1" begin="3.4s" dur="0.1s" fill="freeze"/>
      </line>
      <text x="1003" y="177" fill="#e3b341" font-weight="bold" opacity="0">verdict: REVIEW  88/100
        <animate attributeName="opacity" from="0" to="1" begin="3.9s" dur="0.2s" fill="freeze"/>
      </text>
      <text x="1003" y="193" fill="#30363d" opacity="0">sha256: a3f7c2&#x2026;
        <animate attributeName="opacity" from="0" to="1" begin="4.4s" dur="0.2s" fill="freeze"/>
      </text>
      <!-- blinking cursor -->
      <text x="1085" y="193" fill="#00d4ff" opacity="0">&#x258B;
        <animate attributeName="opacity" from="0" to="1" begin="4.5s" dur="0.1s" fill="freeze"/>
        <animate attributeName="opacity" values="1;0;1;0" dur="0.9s" begin="4.6s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- Terminal scan sweep line -->
    <rect x="992" y="62" width="192" height="1" fill="#00d4ff" opacity="0">
      <animate attributeName="y" values="62;234;62" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.18;0;0" dur="7s" repeatCount="indefinite" keyTimes="0;0.25;0.6;1"/>
    </rect>

    <!-- Bottom accent -->
    <rect y="258" width="1200" height="2" fill="url(#accent)" opacity="0.45"/>
    <!-- Outer border -->
    <rect width="1200" height="260" fill="none" stroke="#1c2333" stroke-width="1.5" rx="14"/>
  </g>
</svg>
