<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#04080f"/>
      <stop offset="50%" style="stop-color:#060a12"/>
      <stop offset="100%" style="stop-color:#080c14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0"/>
      <stop offset="20%" style="stop-color:#00d4ff"/>
      <stop offset="80%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="divider" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0"/>
      <stop offset="40%" style="stop-color:#00d4ff;stop-opacity:0.55"/>
      <stop offset="60%" style="stop-color:#a855f7;stop-opacity:0.55"/>
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" x="0" y="0" width="1200" height="4" patternUnits="userSpaceOnUse">
      <rect width="1200" height="2" fill="transparent"/>
      <rect y="2" width="1200" height="2" fill="rgba(0,0,0,0.1)"/>
    </pattern>
    <clipPath id="clip"><rect width="1200" height="260" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <!-- Background -->
    <rect width="1200" height="260" fill="url(#bg)"/>

    <!-- CRT scanlines -->
    <rect width="1200" height="260" fill="url(#scan)"/>

    <!-- Grid -->
    <g opacity="0.028" stroke="#00d4ff" stroke-width="0.5">
      <line x1="0" y1="40" x2="1200" y2="40"/><line x1="0" y1="80" x2="1200" y2="80"/>
      <line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="160" x2="1200" y2="160"/>
      <line x1="0" y1="200" x2="1200" y2="200"/><line x1="0" y1="240" x2="1200" y2="240"/>
      <line x1="80" y1="0" x2="80" y2="260"/><line x1="160" y1="0" x2="160" y2="260"/>
      <line x1="240" y1="0" x2="240" y2="260"/><line x1="320" y1="0" x2="320" y2="260"/>
      <line x1="400" y1="0" x2="400" y2="260"/><line x1="480" y1="0" x2="480" y2="260"/>
      <line x1="560" y1="0" x2="560" y2="260"/><line x1="640" y1="0" x2="640" y2="260"/>
      <line x1="720" y1="0" x2="720" y2="260"/><line x1="800" y1="0" x2="800" y2="260"/>
      <line x1="880" y1="0" x2="880" y2="260"/><line x1="960" y1="0" x2="960" y2="260"/>
      <line x1="1040" y1="0" x2="1040" y2="260"/><line x1="1120" y1="0" x2="1120" y2="260"/>
    </g>

    <!-- Top accent line -->
    <rect y="0" width="1200" height="2" fill="url(#accent)"/>

    <!-- Left ambient glow -->
    <ellipse cx="112" cy="130" rx="110" ry="75" fill="#00d4ff" opacity="0.04">
      <animate attributeName="opacity" values="0.03;0.07;0.03" dur="4s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Rune — glow layer -->
    <text x="112" y="172" font-family="serif" font-size="150" text-anchor="middle" fill="#00d4ff" filter="url(#glow)">&#x16B2;
      <animate attributeName="opacity" values="0.11;0.24;0.11" dur="3.5s" repeatCount="indefinite"/>
    </text>
    <!-- Rune — main -->
    <text x="112" y="172" font-family="serif" font-size="150" text-anchor="middle" fill="#cce8ff" opacity="0.82">&#x16B2;</text>

    <!-- Vertical divider -->
    <rect x="215" y="28" width="1" height="204" fill="url(#divider)"/>

    <!-- ===== CENTER: main content ===== -->
    <foreignObject x="234" y="0" width="742" height="260">
      <div xmlns="http://www.w3.org/1999/xhtml" style="width:742px;height:260px;display:flex;flex-direction:column;justify-content:center;padding:0;box-sizing:border-box;overflow:hidden;">

        <div style="font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:92px;font-weight:900;letter-spacing:-4px;line-height:1;color:#eaf4ff;animation:glitch 8s infinite;text-shadow:0 0 18px rgba(0,212,255,0.45),0 0 60px rgba(0,212,255,0.15);">KENAZ</div>

        <div style="font-family:'SF Mono','Fira Code',Consolas,monospace;font-size:11px;letter-spacing:5px;color:#00d4ff;margin-top:5px;opacity:0.8;">&#x16B2; &#160;&#183;&#160; FUTHARK &#160;&#183;&#160; KNOWLEDGE &#160;&#183;&#160; TORCH</div>

        <div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;color:#8b949e;margin-top:9px;letter-spacing:0.2px;">Security auditor for Claude Code plugins &amp; MCP servers</div>

        <div style="margin-top:16px;">
          <div style="font-family:'SF Mono',Consolas,monospace;font-size:9px;letter-spacing:2.5px;color:rgba(0,212,255,0.4);margin-bottom:5px;">SCANNING THREAT DATABASE &#160;&#183;&#160; 23 RULES</div>
          <div style="width:300px;height:3px;background:rgba(0,212,255,0.07);border-radius:2px;overflow:hidden;border:1px solid rgba(0,212,255,0.12);">
            <div style="height:100%;background:linear-gradient(90deg,#00d4ff,#a855f7);border-radius:2px;animation:bar 5s ease-in-out infinite;width:0%;"></div>
          </div>
        </div>

        <div style="display:flex;gap:5px;margin-top:13px;flex-wrap:nowrap;">
          <span style="padding:2px 8px;background:rgba(0,212,255,0.07);border:1px solid rgba(0,212,255,0.22);border-radius:4px;font-family:'SF Mono',Consolas,monospace;font-size:10.5px;font-weight:600;color:#79c0ff;white-space:nowrap;">v1.1.0</span>
          <span style="padding:2px 8px;background:rgba(86,211,100,0.07);border:1px solid rgba(86,211,100,0.22);border-radius:4px;font-family:'SF Mono',Consolas,monospace;font-size:10.5px;font-weight:600;color:#56d364;white-space:nowrap;">MIT</span>
          <span style="padding:2px 8px;background:rgba(86,211,100,0.07);border:1px solid rgba(86,211,100,0.22);border-radius:4px;font-family:'SF Mono',Consolas,monospace;font-size:10.5px;font-weight:600;color:#56d364;white-space:nowrap;">99 tests &#10003;</span>
          <span style="padding:2px 8px;background:rgba(0,212,255,0.07);border:1px solid rgba(0,212,255,0.22);border-radius:4px;font-family:'SF Mono',Consolas,monospace;font-size:10.5px;font-weight:600;color:#79c0ff;white-space:nowrap;">100% offline</span>
          <span style="padding:2px 8px;background:rgba(168,85,247,0.07);border:1px solid rgba(168,85,247,0.22);border-radius:4px;font-family:'SF Mono',Consolas,monospace;font-size:10.5px;font-weight:600;color:#d2a8ff;white-space:nowrap;">zero deps</span>
          <span style="padding:2px 8px;background:rgba(227,179,65,0.07);border:1px solid rgba(227,179,65,0.22);border-radius:4px;font-family:'SF Mono',Consolas,monospace;font-size:10.5px;font-weight:600;color:#e3b341;white-space:nowrap;">OWASP Top 10</span>
        </div>

        <style>
          @keyframes glitch {
            0%,85%,100%{text-shadow:0 0 18px rgba(0,212,255,0.45),0 0 60px rgba(0,212,255,0.15);transform:none}
            86%{text-shadow:3px 0 #00d4ff,-3px 0 #f05,0 0 12px rgba(0,212,255,0.5);transform:translateX(-2px)}
            87%{text-shadow:-4px 0 #00d4ff,4px 0 #f05;transform:translateX(3px)}
            88%{text-shadow:2px 0 #f05,-2px 0 #00d4ff;transform:translateX(-1px)}
            89%{text-shadow:0 0 18px rgba(0,212,255,0.45),0 0 60px rgba(0,212,255,0.15);transform:none}
          }
          @keyframes bar {
            0%{width:0%}
            50%{width:88%}
            85%{width:88%}
            95%{width:100%}
            97%{width:0%}
            100%{width:0%}
          }
        </style>
      </div>
    </foreignObject>

    <!-- ===== TERMINAL PANEL ===== -->
    <rect x="992" y="26" width="192" height="210" rx="8" fill="#010409" stroke="#1c2333" stroke-width="1"/>
    <rect x="992" y="26" width="192" height="28" rx="8" fill="#0d1117"/>
    <rect x="992" y="40" width="192" height="14" fill="#0d1117"/>
    <circle cx="1010" cy="40" r="5" fill="#ff5f57"/>
    <circle cx="1025" cy="40" r="5" fill="#febc2e"/>
    <circle cx="1040" cy="40" r="5" fill="#28c840"/>
    <text x="1088" y="44.5" font-family="monospace" font-size="9" fill="#3d444d" text-anchor="middle">kenaz &#x2014; scan</text>

    <!-- Terminal content -->
    <foreignObject x="1003" y="62" width="175" height="166">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'SF Mono','Fira Code',Consolas,monospace;font-size:10px;line-height:1.8;overflow:hidden;height:166px;">
        <div style="color:#3d8ef0;opacity:0;animation:appear 0.25s ease 0.3s forwards;">$ /kenaz git-helper</div>
        <div style="color:#30363d;opacity:0;animation:appear 0.25s ease 0.9s forwards;">&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;</div>
        <div style="color:#484f58;opacity:0;animation:appear 0.25s ease 1.4s forwards;"><span style="color:#56d364;">&#10003;</span> PA-001 &#160;exfiltration</div>
        <div style="color:#484f58;opacity:0;animation:appear 0.25s ease 1.9s forwards;"><span style="color:#56d364;">&#10003;</span> PA-004 &#160;secret-read</div>
        <div style="color:#484f58;opacity:0;animation:appear 0.25s ease 2.4s forwards;"><span style="color:#e3b341;">&#9888;</span> PA-022 &#160;shell-inject</div>
        <div style="color:#484f58;opacity:0;animation:appear 0.25s ease 2.9s forwards;"><span style="color:#56d364;">&#10003;</span> PA-015 &#160;prompt-inject</div>
        <div style="color:#30363d;opacity:0;animation:appear 0.25s ease 3.4s forwards;">&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;</div>
        <div style="color:#e3b341;font-weight:bold;opacity:0;animation:appear 0.25s ease 3.9s forwards;">verdict: REVIEW &#160;88/100</div>
        <div style="color:#30363d;opacity:0;animation:appear 0.25s ease 4.4s forwards;">sha256: a3f7c2&#x2026;<span style="animation:blink 1s infinite;color:#00d4ff;">&#x258B;</span></div>
        <style>
          @keyframes appear{from{opacity:0;transform:translateX(-3px)}to{opacity:1;transform:translateX(0)}}
          @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
        </style>
      </div>
    </foreignObject>

    <!-- Scan sweep line in terminal -->
    <rect x="992" y="62" width="192" height="1" fill="#00d4ff">
      <animate attributeName="y" values="62;234;62" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.18;0;0" dur="7s" repeatCount="indefinite" keyTimes="0;0.25;0.6;1"/>
    </rect>

    <!-- Bottom accent line -->
    <rect y="258" width="1200" height="2" fill="url(#accent)" opacity="0.45"/>

    <!-- Outer border -->
    <rect width="1200" height="260" fill="none" stroke="#1c2333" stroke-width="1.5" rx="14"/>
  </g>
</svg>
